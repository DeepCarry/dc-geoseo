<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GEO Workspace{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="lang-{{ current_lang | default('zh') }}">
  {% block content %}{% endblock %}
  <script>
    document.body.addEventListener('htmx:beforeRequest', function () {
      document.body.classList.add('is-busy');
    });
    document.body.addEventListener('htmx:afterRequest', function () {
      document.body.classList.remove('is-busy');
    });
    document.body.addEventListener('click', function (event) {
      const trigger = event.target.closest('[data-copy-target]');
      if (!trigger) return;
      const selector = trigger.getAttribute('data-copy-target');
      const source = document.querySelector(selector);
      if (!source) return;
      const text = source.innerText || source.textContent || '';
      const copiedText = "{{ '已复制' if current_lang == 'zh' else 'Copied' }}";
      navigator.clipboard.writeText(text).then(function () {
        const original = trigger.textContent;
        trigger.textContent = copiedText;
        setTimeout(function () {
          trigger.textContent = original;
        }, 1200);
      });
    });
  </script>
</body>
</html>
