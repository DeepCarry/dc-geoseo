<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GEO Workspace{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="lang-{{ current_lang | default('zh') }}">
  {% block content %}{% endblock %}
  <script>
    (function () {
      function closestHxPost(element) {
        return element && element.closest ? element.closest('[hx-post]') : null;
      }

      function targetFor(trigger) {
        var selector = trigger.getAttribute('hx-target') || '#workspace-shell';
        return document.querySelector(selector);
      }

      function formDataFor(trigger) {
        var form = trigger.matches('form') ? trigger : trigger.closest('form');
        return form ? new FormData(form) : new FormData();
      }

      function requestSwap(trigger) {
        if (window.htmx) return false;
        var url = trigger.getAttribute('hx-post');
        var target = targetFor(trigger);
        if (!url || !target) return false;
        document.body.classList.add('is-busy');
        fetch(url, {
          method: 'POST',
          body: formDataFor(trigger),
          credentials: 'same-origin'
        }).then(function (response) {
          if (!response.ok) throw new Error('Request failed: ' + response.status);
          return response.text();
        }).then(function (html) {
          target.outerHTML = html;
        }).catch(function (error) {
          console.error(error);
        }).finally(function () {
          document.body.classList.remove('is-busy');
        });
        return true;
      }

      document.body.addEventListener('submit', function (event) {
        var trigger = closestHxPost(event.target);
        if (!trigger) return;
        if (requestSwap(trigger)) event.preventDefault();
      });

      document.body.addEventListener('click', function (event) {
        var trigger = closestHxPost(event.target);
        if (!trigger) return;
        if (requestSwap(trigger)) event.preventDefault();
      });
    })();

    document.body.addEventListener('htmx:beforeRequest', function () {
      document.body.classList.add('is-busy');
    });
    document.body.addEventListener('htmx:afterRequest', function () {
      document.body.classList.remove('is-busy');
    });
    document.body.addEventListener('click', function (event) {
      const trigger = event.target.closest('[data-copy-target]');
      if (!trigger) return;
      const selector = trigger.getAttribute('data-copy-target');
      const source = document.querySelector(selector);
      if (!source) return;
      const text = source.innerText || source.textContent || '';
      const copiedText = "{{ '已复制' if current_lang == 'zh' else 'Copied' }}";
      navigator.clipboard.writeText(text).then(function () {
        const original = trigger.textContent;
        trigger.textContent = copiedText;
        setTimeout(function () {
          trigger.textContent = original;
        }, 1200);
      });
    });
  </script>
</body>
</html>
